name: Probe version sources
on:
  push:
    branches: [ccr-1ae6b9c3-fgg8gy]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          curl -sSL --max-time 30 -A "Mozilla/5.0" "https://www.apkmirror.com/apk/google-inc/google-play-books/feed/" > feed.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for item in ET.parse('feed.xml').getroot().iter('item'):
              print(item.findtext('pubDate'), '|', item.findtext('title'))
          PY
